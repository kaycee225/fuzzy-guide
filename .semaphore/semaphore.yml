version: v1.0

name: Download Torrent and Upload to Filemirage

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

blocks:
  - name: Download, Zip & Upload
    task:
      jobs:
        - name: Download, Zip and Upload Files
          commands:
            - checkout
            - echo "📦 Installing dependencies (7-zip, Python3)..."
            - sudo apt update
            - sudo apt install -y p7zip-full python3 python3-requests python3-pip curl
            - pip3 install --break-system-packages libtorrent requests
            
            - echo "📥 Downloading torrent with Python Libtorrent and Kill-Switch/Dynamic Listener..."
            - mkdir -p downloads 
            - |
              python3 - << 'EOF'
              import libtorrent as lt
              import time, os, requests
              from datetime import datetime

              ses = lt.session()
              ses.listen_on(6881, 6891)
              
              settings = ses.get_settings()
              settings['active_downloads'] = 10
              settings['active_limit'] = 25
              ses.apply_settings(settings)

              save_path = "downloads"
              link_url = "https://pink-script-snap.lovable.app/api/public/page/0e01cfaf-128c-477f-bff1-9dee23822d97.txt"
              kill_url = link_url 

              added_links = set()
              print("Fetching links and starting downloads...", flush=True)

              update_count = 0
              while True:
                  update_count += 1
                  timestamp = datetime.now().strftime("%H:%M:%S")

                  try:
                      ks = requests.get(link_url, timeout=5).text
                      if "STOP.ALL.TORRENTS" in ks:
                          print("\n" + "="*50 + f"\n🛑 Global kill switch activated! | {timestamp}\n" + "="*50)
                          break
                          
                      for link in ks.splitlines():
                          link = link.strip()
                          if link and not link.startswith('#') and not link.endswith(' NO') and link not in added_links:
                              print(f"📥 New dynamic link detected: {link[:60]}...", flush=True)
                              params = {
                                  'save_path': save_path,
                                  'storage_mode': lt.storage_mode_t.storage_mode_sparse
                              }
                              if link.startswith('magnet:'):
                                  lt.add_magnet_uri(ses, link, params)
                              elif link.startswith('http'):
                                  tor_data = requests.get(link).content
                                  with open('temp.torrent', 'wb') as tf: tf.write(tor_data)
                                  info = lt.torrent_info('temp.torrent')
                                  ses.add_torrent({'ti': info, 'save_path': save_path})
                                  os.remove('temp.torrent')
                              added_links.add(link)

                      targets = [l.replace(' NO','').strip().lower() for l in ks.splitlines() if l.endswith(' NO') and l.strip()]
                      if targets:
                          for h in ses.get_torrents():
                              st = h.status()
                              if any(tg in st.name.lower() for tg in targets if tg):
                                  print(f"🗑️ Removing target torrent per remote instruction: {st.name}")
                                  ses.remove_torrent(h)
                  except Exception as e:
                      pass

                  torrents = ses.get_torrents()
                  if not torrents:
                      print("📥 Waiting for active torrents...", flush=True)
                      time.sleep(5)
                      continue

                  incomplete = 0
                  for h in torrents:
                      st = h.status()
                      name = st.name if st.has_metadata else "Downloading Metadata..."
                      prog = int(st.progress * 100)
                      speed_mb = st.download_rate / (1024 * 1024)
                      print(f"📥 Torrent: {name} | {prog}% | Speed: {speed_mb:.2f} MB/s", flush=True)
                      if not st.is_finished:
                          incomplete += 1

                  if incomplete == 0:
                      print("✅ All downloads finished!", flush=True)
                      break
                  time.sleep(10)
              EOF
            
            - echo "📦 Running Smart Auto-Group Zipping & Splitting..."
            - |
              python3 - << 'EOF'
              import os, shutil, subprocess, re
              from collections import defaultdict

              folder = "downloads"
              video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
              media_ext = video_ext + ('.srt', '.ass', '.vtt', '.sub')
              max_bytes = 10000 * 1024 * 1024

              def get_dir_size(p):
                  return sum(os.path.getsize(os.path.join(dp, f)) for dp, _, fn in os.walk(p) for f in fn)

              def create_7z_group(group_name, file_paths, base_dir, max_bytes_limit):
                  group_dir = os.path.join(base_dir, group_name)
                  os.makedirs(group_dir, exist_ok=True)
                  
                  files_to_move = list(file_paths)
                  for p in file_paths:
                      base_stem = os.path.splitext(p)[0]
                      for sub_ext in ('.srt', '.ass', '.vtt', '.sub'):
                          sub_file = base_stem + sub_ext
                          if os.path.exists(sub_file) and sub_file not in files_to_move:
                              files_to_move.append(sub_file)

                  for p in files_to_move:
                      dst = os.path.join(group_dir, os.path.basename(p))
                      if p != dst and not os.path.exists(dst):
                          shutil.move(p, dst)
                  
                  folder_size = get_dir_size(group_dir)
                  zip_name = f"{group_name}.zip"
                  orig = os.getcwd()
                  os.chdir(base_dir)
                  cmd = ["7z", "a", "-mx0", zip_name, group_name]
                  if folder_size > max_bytes_limit:
                      cmd.insert(2, "-v5900m")
                  subprocess.run(cmd, check=True)
                  os.chdir(orig)
                  shutil.rmtree(group_dir)

              # RULE 4: Pre-Existing Folders with > 3 videos
              if os.path.exists(folder):
                  for item in os.listdir(folder):
                      item_path = os.path.join(folder, item)
                      if os.path.isdir(item_path):
                          vids = [
                              os.path.join(r, f) for r, _, files in os.walk(item_path)
                              for f in files if f.lower().endswith(video_ext)
                          ]
                          if len(vids) > 3:
                              print(f"📦 RULE 4 (Folder > 3 videos): Zipping {item}")
                              folder_size = get_dir_size(item_path)
                              orig = os.getcwd()
                              os.chdir(folder)
                              zip_name = f"{item}.zip"
                              cmd = ["7z", "a", "-mx0", zip_name, item]
                              if folder_size > max_bytes:
                                  cmd.insert(2, "-v5900m")
                              subprocess.run(cmd, check=True)
                              os.chdir(orig)
                              shutil.rmtree(item_path)

              # Collect remaining videos for Rules 2 & 3
              remaining_videos = []
              for r, _, files in os.walk(folder):
                  for f in files:
                      if f.lower().endswith(video_ext):
                          remaining_videos.append(os.path.join(r, f))

              # RULE 2: Series Grouping by Season (>3 episodes)
              series_regex = re.compile(r'(?i)^(.*?)[.\s_-]+S(\d{1,2})(?:[EX\-]|\b)')
              def clean_series_name(raw_name):
                  return re.sub(r'(?i)(www\.[^\s]+\s*-\s*|^\[.*?\]\s*)', '', raw_name).strip('. -_')

              series_groups = defaultdict(list)
              for vid_path in remaining_videos:
                  vid_name = os.path.basename(vid_path)
                  parent_name = os.path.basename(os.path.dirname(vid_path))
                  match = series_regex.search(vid_name) or series_regex.search(parent_name)
                  if match:
                      s_name = clean_series_name(match.group(1))
                      s_num = match.group(2)
                      group_key = f"{s_name.lower()}_S{s_num}"
                      series_groups[group_key].append(vid_path)

              for group_key, vids in series_groups.items():
                  if len(vids) > 3:
                      first_stem = os.path.splitext(os.path.basename(vids[0]))[0]
                      print(f"📦 RULE 2 (Series > 3 eps): Grouping {len(vids)} episodes into {first_stem}.zip")
                      create_7z_group(first_stem, vids, folder, max_bytes)
                      for v in vids:
                          if v in remaining_videos:
                              remaining_videos.remove(v)

              # RULE 3: The Leftovers (>3 loose videos)
              if len(remaining_videos) > 3:
                  first_stem = os.path.splitext(os.path.basename(remaining_videos[0]))[0]
                  print(f"📦 RULE 3 (Leftovers > 3 videos): Grouping {len(remaining_videos)} videos into {first_stem}.zip")
                  create_7z_group(first_stem, remaining_videos, folder, max_bytes)
                  remaining_videos.clear()

              # RULE 1: Standalone Items (Flatten structure, keeping standalone files raw)
              for r, dirs, files in os.walk(folder, topdown=False):
                  if r == folder: continue
                  for f in files:
                      if f.lower().endswith(media_ext):
                        src = os.path.join(r, f)
                        dst = os.path.join(folder, f)
                        if not os.path.exists(dst): 
                            shutil.move(src, dst)
                  shutil.rmtree(r, ignore_errors=True)
              EOF

            - echo "📤 Uploading files to Filemirage via Memory-Safe Curl..."
            - |
              python3 - << 'EOF'
              import os
              import subprocess
              import requests

              FILEMIRAGE_API_TOKEN = '9QQH-DGES-CWQZ-FXNV'
              FOLDER_PATH = 'downloads'

              try:
                  srv_res = requests.get("https://filemirage.com/api/servers", timeout=10).json()
                  SERVER = srv_res['data']['server']
              except Exception as e:
                  print(f"Failed to fetch Filemirage server: {e}")
                  exit(1)

              if os.path.exists(FOLDER_PATH):
                  for root, dirs, files in os.walk(FOLDER_PATH):
                      for filename in files:
                          if ".!qB" in filename or ".part" in filename:
                              continue
                          file_path = os.path.join(root, filename)
                          file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
                          print(f"⬆️ Uploading: {filename} ({file_size_mb:.2f} MB)")
                          
                          # Using curl directly handles multi-gigabyte streaming with zero Python memory overhead
                          curl_cmd = [
                              "curl", "-s", "-S", "-X", "POST",
                              f"{SERVER}/upload.php",
                              "-H", f"Authorization: Bearer {FILEMIRAGE_API_TOKEN}",
                              "-F", f"file=@{file_path}",
                              "--max-time", "3600"
                          ]
                          
                          result = subprocess.run(curl_cmd, capture_output=True, text=True)
                          if result.returncode == 0:
                              print(f"✅ Response for {filename}: {result.stdout}")
                          else:
                              print(f"❌ Curl Error uploading {filename}: {result.stderr}")
              EOF
